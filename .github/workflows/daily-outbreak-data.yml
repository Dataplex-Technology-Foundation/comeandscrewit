name: Daily outbreak data refresh

on:
  schedule:
    # 12:00 UTC daily. Adjust if APHIS updates its page on a different cadence.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-outbreak-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        id: scrape
        # Continue past a failure: the script still writes every file it
        # managed to produce before exiting non-zero on a degraded parse
        # (see scripts/scrape_outbreak_data.py). We want that partial
        # output PR'd for review AND the job to end red for visibility, so
        # we capture the failure and re-raise it after the later steps run.
        continue-on-error: true
        run: python3 scripts/scrape_outbreak_data.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- assets/data reference; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request for review
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Automated outbreak data refresh"
          branch: automation/outbreak-data-refresh
          delete-branch: true
          title: "Automated outbreak data refresh — ${{ github.run_id }}"
          body-path: scratch/pr-body.md
          labels: automated-data-refresh
          add-paths: |
            assets/data/outbreak-data.json
            assets/data/outbreak-history.json
            reference/screwworm-gov-research-publications.md

      - name: Upload debug HTML (for selector troubleshooting on parse failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug-html
          path: scratch/last-fetch-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail job if the scrape was degraded
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Scraper reported a degraded parse (fetch succeeded, zero fields matched) — see the 'Run scraper' step log and the scrape-debug-html artifact."
          exit 1
