name: CI

on:
  pull_request: {}

# Least privilege: this job only reads the repo and runs local checks, it
# never needs to write anything or use a token for anything else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the release commit SHA (not the mutable "v4" tag) so a
      # compromised/re-pointed tag upstream can't silently change what
      # runs here. Comment records the tag it corresponds to for humans.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install -r tests/requirements.txt

      - name: Compile-check Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate workflow YAML
        run: |
          python3 - <<'EOF'
          import sys
          import yaml
          from pathlib import Path

          failed = False
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text())
                  print(f"OK: {path}")
              except yaml.YAMLError as exc:
                  print(f"INVALID: {path}\n{exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      # The publish boundary, enforced at review time rather than at deploy
      # time. Same script publish.yml runs, so the two cannot disagree about
      # what is publishable.
      - name: Gate the publish boundary
        run: python3 scripts/0005_build_site_artifact.py --check

      # A gate that never fails is not a gate. Prove it rejects the three ways
      # internal content can reach the artifact, on every pull request.
      - name: Prove the gate rejects known bypasses
        run: |
          set -u
          root=$(mktemp -d)
          cp -r . "$root/repo"
          cd "$root/repo"

          expect_fail() {
            if python3 scripts/0005_build_site_artifact.py --check >/dev/null 2>&1; then
              echo "::error::gate ACCEPTED a tree it must reject: $1"
              exit 1
            fi
            echo "gate correctly rejects: $1"
          }

          # 1. An internal file misfiled into the publish root.
          echo internal > LEAK-TEST.md && git add -f LEAK-TEST.md 2>/dev/null || true
          expect_fail "an unexcluded .md at the repo root"
          rm -f LEAK-TEST.md && git rm -q --cached LEAK-TEST.md 2>/dev/null || true

          # 2. A symlink out of the publish root. upload-pages-artifact runs
          #    tar --dereference, so this would publish whatever it points at.
          mkdir -p internal-target && echo secret > internal-target/x.md
          ln -s ../internal-target assets/escape
          expect_fail "a symlink escaping the publish root"
          rm -f assets/escape

          # 3. A placeholder back in a machine-consumed URL context.
          sed -i 's|<link rel="canonical" href="https://comeandscrewit.com/faq.html">|<link rel="canonical" href="https://[DOMAIN]/faq.html">|' faq.html
          expect_fail "an unreplaced [DOMAIN] in rel=canonical"

          echo "all bypass attempts rejected"
