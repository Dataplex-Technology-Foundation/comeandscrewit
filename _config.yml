# Jekyll configuration — TRANSITIONAL.
#
# GitHub Pages currently builds this repo with build_type: legacy, which runs
# Jekyll over the whole branch and publishes every non-dot-prefixed path -- both
# verbatim and, for markdown, as a themed HTML page carrying a rel=canonical tag.
# That is the defect plan 0003 exists to remove.
#
# The permanent fix is the publish boundary: Pages switches to build_type:
# workflow and .github/workflows/publish.yml uploads only the publish root, so
# everything else is absent from the artifact rather than excluded from it by a
# rule. Until that cutover lands, this file is the stopgap.
#
# It is a DENYLIST, and denylists are exactly what plan 0003 argues against --
# `Dockerfile`'s `rm -f` list was a second instance of this same bug. It is here
# only because it is the one control available before the cutover, and it closes
# the live exposure immediately rather than at the end of the sequence.
# scripts/0005_build_site_artifact.py asserts that every top-level entry outside
# the publish set appears below, so this cannot silently fall behind. Delete this
# file once the cutover is verified.
#
# Note `exclude` REPLACES Jekyll's built-in default list, so the defaults are
# restated at the bottom. Dot-prefixed paths (.github, .gitignore) are excluded
# by Jekyll regardless -- verified: /.github/workflows/ci.yml returns 404.

exclude:
  # Internal material. Nothing under these belongs on comeandscrewit.com.
  - internal
  - scripts
  - tests
  - reference
  - docs

  # Deployment and container configuration.
  - Dockerfile
  - docker-compose.yml
  - nginx.conf

  # Repository documentation.
  - README.md
  - CONTRIBUTING.md

  # Jekyll's own defaults, restated because setting `exclude` overrides them.
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor

# `theme:` and `plugins:` are deliberately NOT set. Every page here is
# hand-written HTML with no front matter, which Jekyll copies verbatim -- live
# bytes are already sha256-identical to the repo, so no theme or tag injection is
# reaching them. Overriding either key risks failing the Pages build for no gain,
# and a failed build is a worse outcome than a redundant plugin.
